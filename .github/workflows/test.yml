name: tests
on:
  push:
  pull_request:
jobs:
  synthetic-offline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Synthetic tests, no model API
        run: python -m pytest -q
