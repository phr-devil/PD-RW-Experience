[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdrw-experience"
version = "0.2.0a1"
description = "Evidence-grounded scientific experience learning adapter"
requires-python = ">=3.11"
dependencies = ["cryptography>=43,<48"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pdrw-exp = "pdrw_experience.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
